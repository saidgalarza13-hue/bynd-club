<!DOCTYPE html>
<html lang="es">
<head>
  <!-- `flutter build web --base-href /bynd-club/` reemplaza este valor. -->
  <base href="/bynd-club/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="BYND Club: tus clubes de pádel, tus puntos y tus reservas en una sola app.">
  <meta name="theme-color" content="#F5F5F3">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BYND Club">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BYND Club</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- La fuente no frena la pantalla de carga: las tarjetas salen al instante y
       el logo aparece cuando Manrope ya está lista (o a los 1,5 s, lo que pase antes). -->
  <script>
    (function () {
      var h = document.documentElement;
      function listo() { h.classList.add('sp-listo'); }
      window.__spFuente = function () {
        if (document.fonts && document.fonts.load) document.fonts.load('800 28px Manrope').then(listo, listo);
        else listo();
      };
      setTimeout(listo, 1500);
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=block" media="print" onload="this.media='all'; window.__spFuente()">

  <!-- Pantalla de carga: se ve apenas abre la página y se va cuando la app pinta. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F5F5F3; }
    #bynd-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F5F5F3; color: #0F0F10;
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .45s ease, transform .45s ease;
      -webkit-user-select: none; user-select: none;
    }
    #bynd-splash.fuera { opacity: 0; transform: scale(1.03); pointer-events: none; }

    .sp-cartas { position: relative; width: 280px; height: 178px; margin-top: -40px; }
    .sp-carta {
      position: absolute; left: 50%; top: 50%; width: 168px; height: 106px;
      margin: -53px 0 0 -84px; opacity: 0;
      animation: sp-abrir .9s cubic-bezier(.2, .85, .25, 1) forwards;
    }
    .sp-carta > div { width: 100%; height: 100%; animation: sp-flotar 3.2s ease-in-out infinite alternate; }
    .sp-carta svg { display: block; width: 100%; height: 100%; border-radius: 12px; }
    .sp-all { --fin: translate(-46px, -4px) rotate(-9deg); animation-delay: .05s; }
    .sp-all > div { animation-delay: -1.1s; }
    .sp-all svg { box-shadow: 0 16px 34px -12px rgba(4, 26, 79, .55); }
    .sp-p1 { --fin: translate(46px, 12px) rotate(8deg); animation-delay: .2s; }
    .sp-p1 > div { animation-delay: -2.2s; }
    .sp-p1 svg { box-shadow: 0 18px 36px -12px rgba(0, 0, 0, .55); }
    @keyframes sp-abrir {
      from { opacity: 0; transform: translateY(26px) scale(.9); }
      to { opacity: 1; transform: var(--fin); }
    }
    @keyframes sp-flotar { from { transform: translateY(-3px); } to { transform: translateY(4px); } }

    .sp-marca { display: flex; align-items: center; margin-top: 30px; opacity: 0; }
    .sp-lema, .sp-pie { opacity: 0; }
    .sp-listo .sp-marca { animation: sp-subir .7s .3s ease forwards; }
    .sp-listo .sp-lema { animation: sp-subir .7s .45s ease forwards; }
    .sp-listo .sp-pie { animation: sp-subir .7s .55s ease forwards; }
    .sp-bynd { font-weight: 800; font-size: 28px; letter-spacing: .32em; margin-right: -.1em; line-height: 1; }
    .sp-raya { width: 1px; height: 21px; background: rgba(15, 15, 16, .3); margin: 0 12px 0 0; }
    .sp-club { font-weight: 600; font-size: 17px; letter-spacing: .22em; color: rgba(15, 15, 16, .7); line-height: 1; }
    .sp-lema {
      margin-top: 10px; font-size: 13.5px; font-weight: 600; color: #66666C;
    }
    .sp-carga { width: 112px; height: 3px; margin-top: 26px; border-radius: 3px; background: #E3E3E0; overflow: hidden; }
    .sp-carga i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #0F0F10; animation: sp-ir 1.15s ease-in-out infinite; }
    @keyframes sp-subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes sp-ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    .sp-pie {
      position: absolute; left: 0; right: 0; bottom: max(30px, calc(env(safe-area-inset-bottom) + 18px));
      display: flex; align-items: center; justify-content: center;
    }
    .sp-pie span { font-size: 10.5px; font-weight: 700; letter-spacing: .2em; color: #9A9AA0; }
    .sp-pie .sp-raya { height: 12px; margin: 0 10px 0 8px; background: rgba(15, 15, 16, .25); }
    .sp-pie b { font-size: 12.5px; font-weight: 800; letter-spacing: .3em; }

    @media (prefers-reduced-motion: reduce) {
      .sp-carta, .sp-listo .sp-marca, .sp-listo .sp-lema, .sp-listo .sp-pie { animation: none; opacity: 1; transform: var(--fin, none); }
      .sp-carta > div, .sp-carga i { animation: none; }
    }
  </style>
</head>
<body>
  <div id="bynd-splash" aria-label="Cargando BYND Club" role="status">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <!-- Escudo de All Padel: el contorno se corta alrededor de la pala y la pelota. -->
        <mask id="sp-apcorte"><rect width="100" height="100" fill="#fff"/><g transform="translate(44 45) rotate(18.3)"><ellipse rx="25.5" ry="28.5" fill="#000"/><line x1="0" y1="22" x2="0" y2="36" stroke="#000" stroke-width="18" stroke-linecap="round"/></g><circle cx="80" cy="17" r="19.5" fill="#000"/></mask>
        <symbol id="sp-p1" viewBox="0 0 1669 1000"><path d="M1211 370 L1044 370 L931 597 L912 620 L891 635 L851 645 L587 644 L540 661 L520 681 L363 991 L363 998 L529 1000 L598 865 L613 846 L645 824 L669 818 L869 815 L929 796 L988 762 L1042 708 L1063 673 L1207 386ZM1074 92 L592 89 L545 97 L507 110 L439 153 L410 184 L376 232 L15 958 L0 996 L165 994 L507 309 L533 279 L565 264 L588 260 L985 260 L996 251ZM1668 0 L1500 1 L1442 50 L1382 78 L1319 90 L1185 91 L1178 97 L1100 260 L1356 262 L1365 276 L1117 772 L1100 815 L1259 816 L1270 806 L1669 7ZM634 454a86 86 0 1 0 171 0a86 86 0 1 0 -171 0Z"/></symbol>
        <symbol id="sp-ap" viewBox="0 0 100 100">
          <path d="M10 26 H78 V58 Q78 83 44 98 Q10 83 10 58Z" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linejoin="round" mask="url(#sp-apcorte)"/>
          <g transform="translate(44 45) rotate(18.3)"><ellipse rx="21" ry="24"/><line x1="0" y1="22" x2="0" y2="36" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></g>
          <circle cx="80" cy="17" r="14.5"/>
        </symbol>
        <linearGradient id="sp-gp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171B10"/><stop offset="1" stop-color="#070806"/></linearGradient>
        <linearGradient id="sp-gap" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0F3FB8"/><stop offset=".5" stop-color="#1E5BD8"/><stop offset="1" stop-color="#22A7E0"/></linearGradient>
        <pattern id="sp-pts" width="7.5" height="15" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="3.75" r="1.1" fill="#fff"/><circle cx="5.25" cy="11.25" r="1.1" fill="#fff"/></pattern>
        <linearGradient id="sp-gfade"><stop offset=".38" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
        <mask id="sp-mfade"><rect width="168" height="106" fill="url(#sp-gfade)"/></mask>
        <pattern id="sp-rayas" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><rect width="5" height="13" fill="#B7D11B" opacity=".1"/></pattern>
      </defs>
    </svg>

    <div class="sp-cartas" aria-hidden="true">
      <div class="sp-carta sp-all"><div>
        <svg viewBox="0 0 168 106">
          <rect width="168" height="106" fill="url(#sp-gap)"/>
          <rect width="168" height="106" fill="url(#sp-pts)" mask="url(#sp-mfade)" opacity=".13"/>
          <use href="#sp-ap" x="77" y="6" width="114" height="114" fill="#fff" color="#fff" opacity=".13"/>
          <line x1="84" y1="110" x2="131" y2="-4" stroke="#D7F205" stroke-opacity=".85" stroke-width="1.3"/>
          <use href="#sp-ap" x="12" y="9" width="17" height="17" fill="#fff" color="#fff"/>
          <rect x="120" y="11" width="36" height="13" rx="6.5" fill="#D7F205"/>
          <rect x="13" y="80" width="62" height="4" rx="2" fill="#fff" opacity=".25"/>
          <rect x="13" y="80" width="38" height="4" rx="2" fill="#D7F205"/>
        </svg>
      </div></div>
      <div class="sp-carta sp-p1"><div>
        <svg viewBox="0 0 168 106">
          <rect width="168" height="106" fill="url(#sp-gp1)"/>
          <rect width="168" height="106" fill="url(#sp-rayas)"/>
          <use href="#sp-p1" x="84" y="26" width="120" height="72" fill="#B7D11B"/>
          <use href="#sp-p1" x="13" y="12" width="22" height="13" fill="#B7D11B"/>
          <rect x="120.5" y="11.5" width="35" height="12" rx="6" fill="none" stroke="#B7D11B"/>
          <rect x="13" y="80" width="62" height="4" rx="2" fill="#fff" opacity=".2"/>
          <rect x="13" y="80" width="30" height="4" rx="2" fill="#B7D11B"/>
          <rect x=".5" y=".5" width="167" height="105" rx="11.5" fill="none" stroke="#B7D11B" stroke-opacity=".28"/>
        </svg>
      </div></div>
    </div>

    <div class="sp-marca"><span class="sp-bynd">BYND</span><span class="sp-raya"></span><span class="sp-club">CLUB</span></div>
    <div class="sp-lema">Tus clubes. Tus puntos. Una sola app.</div>
    <div class="sp-carga" aria-hidden="true"><i></i></div>

    <div class="sp-pie"><span>POWERED BY</span><span class="sp-raya"></span><b>BYND</b></div>
  </div>

  <script>
    // Se va cuando Flutter pinta su primer cuadro, pero se deja ver al menos
    // 1,4 s para que las tarjetas terminen de abrirse.
    (function () {
      var inicio = Date.now();
      window.addEventListener('flutter-first-frame', function () {
        var s = document.getElementById('bynd-splash');
        if (!s) return;
        setTimeout(function () {
          s.classList.add('fuera');
          setTimeout(function () { s.remove(); }, 500);
        }, Math.max(0, 1400 - (Date.now() - inicio)));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
